<app-navbar></app-navbar>
<section class="register-section">

  <div class="register-card">

    <h2 class="register-title">Crear Cuenta</h2>
    <p class="register-subtitle">Regístrate para comenzar</p>

    <!-- Mensajes de éxito/error -->
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <!-- NOMBRE -->
      <div class="input-group">
        <label>Nombre Completo</label>
        <input 
          type="text" 
          formControlName="nombre" 
          placeholder="Tu nombre"
          autocomplete="name">

        <small *ngIf="getErrorMessage('nombre')" class="error">
          {{ getErrorMessage('nombre') }}
        </small>
      </div>

      <!-- EMAIL -->
      <div class="input-group">
        <label>Correo Electrónico</label>
        <input 
          type="text" 
          formControlName="email" 
          placeholder="ejemplo@correo.com"
          autocomplete="email">

        <small *ngIf="getErrorMessage('email')" class="error">
          {{ getErrorMessage('email') }}
        </small>
      </div>

      <!-- PASSWORDS -->
      <div class="password-row">
        <div class="input-group password-box password-main">
          <label>Contraseña</label>
          <div class="password-wrapper">
            <input 
              [type]="showPass ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="new-password">
            <button 
              type="button" 
              class="toggle-password eye-btn" 
              (click)="showPass = !showPass" 
              [attr.aria-pressed]="showPass" 
              aria-label="Mostrar u ocultar contraseña">
              👁️
            </button>
          </div>

          <small *ngIf="getErrorMessage('password')" class="error">
            {{ getErrorMessage('password') }}
          </small>
        </div>
        <br>
        <div class="input-group password-box password-confirm">
          <label>Confirmar Contraseña</label>
          <div class="password-wrapper">
            <input 
              [type]="showPass2 ? 'text' : 'password'"
              formControlName="password2"
              placeholder="••••••••"
              autocomplete="new-password">
            <button 
              type="button" 
              class="toggle-password eye-btn" 
              (click)="showPass2 = !showPass2" 
              [attr.aria-pressed]="showPass2" 
              aria-label="Mostrar u ocultar confirmar contraseña">
              👁️
            </button>
          </div>

          <small *ngIf="getErrorMessage('password2')" class="error">
            {{ getErrorMessage('password2') }}
          </small>
        </div>
      </div>

      <!-- BOTÓN -->
      <button class="btn-register-main" [disabled]="loading" type="submit">
        {{ loading ? 'Registrando...' : 'Registrarme' }}
      </button>

      <!-- YA TIENES CUENTA -->
      <div class="login-box">
        <p>¿Ya tienes cuenta?</p>
        <button type="button" class="btn-login-link" routerLink="/login">Iniciar Sesión</button>
      </div>

    </form>

  </div>

</section>
<app-footer></app-footer>
