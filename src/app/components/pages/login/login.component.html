<app-navbar></app-navbar>
<section class="login-section">

  <div class="login-card">

    <h2 class="login-title">Iniciar Sesión</h2>
    <p class="login-subtitle">Accede a tu cuenta para continuar</p>

    <!-- Mensajes de éxito/error -->
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <!-- Email -->
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="text" 
          id="email" 
          formControlName="email"
          placeholder="ejemplo@correo.com"
          autocomplete="email">
        
        <small *ngIf="getErrorMessage('email')" class="error">
          {{ getErrorMessage('email') }}
        </small>
      </div>

      <!-- Contraseña -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input 
            [type]="showPass ? 'text' : 'password'"
            id="password" 
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password">
          <button 
            type="button" 
            class="toggle-password eye-btn" 
            (click)="showPass = !showPass" 
            [attr.aria-pressed]="showPass" 
            aria-label="Mostrar u ocultar contraseña">
            👁️
          </button>
        </div>
        
        <small *ngIf="getErrorMessage('password')" class="error">
          {{ getErrorMessage('password') }}
        </small>
      </div>

      <!-- Botón iniciar -->
      <button class="btn-login" type="submit" [disabled]="loading">
        {{ loading ? 'Iniciando...' : 'Ingresar' }}
      </button>

      <!-- Sección de registro -->
      <div class="register-box">
        <p>¿No tienes cuenta?</p>
        <button type="button" class="btn-register" routerLink="/register">Registrarse</button>
      </div>

    </form>

  </div>
</section>

<app-footer></app-footer>
