<app-navbar></app-navbar>

<div class="container mt-5">
  <h1 class="page-title text-center mb-5">Accesorios para Mascotas</h1>
  
  <div class="accesorios-grid">
    <div class="accesorio-card" *ngFor="let accesorio of accesorios">
      <div class="card-image-wrapper">
        <img *ngIf="accesorio.imagen" 
             [src]="url + 'get-imagen/' + accesorio.imagen" 
             [alt]="accesorio.nombre" 
             class="card-image">
        <img *ngIf="!accesorio.imagen" 
             src="https://via.placeholder.com/250x200?text=Sin+imagen" 
             alt="Sin imagen" 
             class="card-image">
      </div>

      <div class="card-content">
        <h5 class="card-title">{{ accesorio.nombre }}</h5>
        <p class="card-subtitle">Accesorio</p>
        
        <div class="card-details">
          <p *ngIf="accesorio.categoria"><strong>Categoría:</strong> {{ accesorio.categoria }}</p>
          <p *ngIf="accesorio.tipo"><strong>Tipo:</strong> {{ accesorio.tipo }}</p>
          <p><strong>Stock:</strong> {{ accesorio.stock }}</p>
          <p class="card-price"><strong>${{ accesorio.precio }}</strong></p>
        </div>

        <div class="card-actions">
          <ng-container *ngIf="confirmingId === accesorio._id; else addBtnAcc">
            <div class="card-confirm">
              <p class="confirm-text">¿Agregar este producto al carrito?</p>
              <div class="confirm-actions">
                <button class="btn-cancel" (click)="cancelConfirm()">Cancelar</button>
                <button class="btn-confirm-delete" (click)="confirmAdd(accesorio)">Agregar</button>
              </div>
            </div>
          </ng-container>
          <ng-template #addBtnAcc>
            <button class="btn-add-cart" [disabled]="!tieneStock(accesorio)" (click)="addToCart(accesorio)">
              {{ tieneStock(accesorio) ? 'Añadir al carrito' : 'Agotado' }}
            </button>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!accesorios || accesorios.length === 0" class="text-center mt-5">
    <p>Cargando accesorios...</p>
  </div>
</div>

<app-footer></app-footer>

<!-- Floating cart button (visible on accesorios) -->
<a class="floating-cart" routerLink="/cart" title="Ver carrito">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-bag-heart" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M10.5 3.5a2.5 2.5 0 0 0-5 0V4h5zm1 0V4H15v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4h3.5v-.5a3.5 3.5 0 1 1 7 0M14 14V5H2v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1M8 7.993c1.664-1.711 5.825 1.283 0 5.132-5.825-3.85-1.664-6.843 0-5.132"/>
  </svg>
  <span *ngIf="cartCount > 0" class="floating-badge">{{ cartCount }}</span>
</a>
